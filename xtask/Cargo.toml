[package]
name = "xtask"
version = "0.1.0"
authors = ["Aleksey Kladov <aleksey.kladov@gmail.com>"]
edition = "2021"

[dependencies]
fs2 = "0.4.3"
libc = "0.2.191"
sha2 = "0.11.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
zstd = { version = "0.14.4", default-features = false }
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }

[dev-dependencies]
serde_yaml = "0.9.34"
